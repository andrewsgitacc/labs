---
# Grow the root filesystem to fill its (already enlarged) virtual disk.
# Works whether / is on LVM (CentOS default: cs-root) or a plain partition.
# Safe to re-run: does nothing if there's no new space.
# Copes with a completely full root filesystem (the usual reason to grow it):
# frees what it can, gives growpart scratch space in RAM (/dev/shm), and skips
# LVM's metadata backup during the resize.

- name: Free some space if the root filesystem is (nearly) full
  ansible.builtin.shell: |
    set -o pipefail
    AVAIL_MB=$(df -BM --output=avail / | tail -1 | tr -d ' M')
    if [ "$AVAIL_MB" -lt 300 ]; then
      journalctl --vacuum-size=50M
      dnf clean all
      command -v crictl >/dev/null && crictl rmi --prune || true
      echo FREED
    fi
  args:
    executable: /bin/bash
  register: free_space
  changed_when: "'FREED' in free_space.stdout"

- name: Install growpart
  ansible.builtin.dnf:
    name: cloud-utils-growpart
    state: present

- name: Grow partition, LVM and filesystem for /
  ansible.builtin.script:
    cmd: grow_root_fs.sh   # k8s/files/grow_root_fs.sh
    executable: /bin/bash
  register: grow_root
  changed_when: "'CHANGED' in grow_root.stdout"

- name: Show root filesystem size
  ansible.builtin.debug:
    msg: "{{ grow_root.stdout_lines | select('match', '^root filesystem') | list }}"
