---
# Raise the kernel's inotify limits. The Rocky/RHEL defaults (128 instances per user)
# run out once a node hosts dozens of pods that watch files (podinfo, Alloy, Prometheus
# config reloaders, Argo CD...), and pods then log
# "failed to create fsnotify watcher: too many open files".
# Values match what kind/k3s and most Kubernetes distributions recommend.

- name: Raise inotify limits for container workloads
  ansible.posix.sysctl:
    name: "{{ item.name }}"
    value: "{{ item.value }}"
    sysctl_file: /etc/sysctl.d/90-inotify.conf
    sysctl_set: true
    state: present
    reload: true
  loop:
    - { name: 'fs.inotify.max_user_instances', value: '8192' }
    - { name: 'fs.inotify.max_user_watches', value: '524288' }
