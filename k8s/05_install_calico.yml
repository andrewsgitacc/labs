---
# Install Calico CNI (replaces Flannel).
#
# Calico enforces Kubernetes NetworkPolicies, which Flannel can't. It's
# installed with the Tigera operator: the operator manifests come from the
# pinned Calico release, and the cluster-specific settings are in
# files/calico-custom-resources.yaml.
#
# The CNI is part of the cluster bootstrap (owned by Ansible), not Argo CD:
# nothing in the cluster can run until the pod network exists.

- name: Prepare nodes for Calico
  hosts: new_cluster_nodes
  become: true

  tasks:
    # Calico manages its own iptables rules and recommends firewalld is off.
    # (06_configure_firewall_for_cni.yml also disables it and reboots the nodes.)
    - name: Stop and disable firewalld
      ansible.builtin.systemd_service:
        name: firewalld
        state: stopped
        enabled: false
      failed_when: false

    # Stop NetworkManager from managing Calico's interfaces (Calico docs requirement).
    - name: Tell NetworkManager to ignore Calico interfaces
      ansible.builtin.copy:
        dest: /etc/NetworkManager/conf.d/calico.conf
        owner: root
        group: root
        mode: '0644'
        content: |
          [keyfile]
          unmanaged-devices=interface-name:cali*;interface-name:tunl*;interface-name:vxlan.calico;interface-name:vxlan-v6.calico;interface-name:wireguard.cali;interface-name:wg-v6.cali
      notify: Reload NetworkManager

  handlers:
    - name: Reload NetworkManager
      ansible.builtin.systemd_service:
        name: NetworkManager
        state: reloaded

- name: Install Calico CNI
  hosts: k8s-control-01.lab.local
  become: true
  vars:
    calico_version: v3.33.0
    calico_manifests: "https://raw.githubusercontent.com/projectcalico/calico/{{ calico_version }}/manifests"
    calico_dir: /root/calico
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
    PATH: "/usr/local/bin:/usr/bin:/bin"

  tasks:
    - name: Create working directory for Calico manifests
      ansible.builtin.file:
        path: "{{ calico_dir }}"
        state: directory
        mode: '0700'

    # v3_projectcalico_org.yaml is the CRD set for Kubernetes 1.36+
    # (1.34/1.35 need v3_projectcalico_org-v1beta1.yaml instead).
    - name: Download Calico manifests for {{ calico_version }}
      ansible.builtin.get_url:
        url: "{{ calico_manifests }}/{{ item }}"
        dest: "{{ calico_dir }}/{{ calico_version }}-{{ item }}"
        mode: '0644'
      loop:
        - v3_projectcalico_org.yaml
        - tigera-operator.yaml

    # Server-side apply: idempotent, and avoids the annotation size limit on Calico's large CRDs.
    - name: Apply Calico CRDs and Tigera operator
      ansible.builtin.command: >
        kubectl apply --server-side --force-conflicts
        -f {{ calico_dir }}/{{ calico_version }}-{{ item }}
      loop:
        - v3_projectcalico_org.yaml
        - tigera-operator.yaml
      changed_when: true

    - name: Wait for the Tigera operator to be ready
      ansible.builtin.command: >
        kubectl rollout status deployment/tigera-operator
        -n tigera-operator --timeout=180s
      changed_when: false

    - name: Wait for the operator's Installation CRD to be registered
      ansible.builtin.command: >
        kubectl wait --for=condition=established
        crd/installations.operator.tigera.io --timeout=60s
      changed_when: false

    - name: Copy Calico custom resources (cluster-specific settings)
      ansible.builtin.copy:
        src: files/calico-custom-resources.yaml
        dest: "{{ calico_dir }}/custom-resources.yaml"
        mode: '0644'

    - name: Apply Calico custom resources
      ansible.builtin.command: >
        kubectl apply --server-side -f {{ calico_dir }}/custom-resources.yaml
      changed_when: true

    # tigerastatus objects only appear once the operator starts reconciling,
    # so poll instead of using kubectl wait.
    - name: Wait for Calico to report Available
      ansible.builtin.command: >
        kubectl get tigerastatus calico
        -o 'jsonpath={.status.conditions[?(@.type=="Available")].status}'
      register: calico_status
      until: calico_status.stdout == "True"
      retries: 40
      delay: 10
      changed_when: false

    - name: Wait for all nodes to reach Ready state
      ansible.builtin.command: >
        kubectl wait --for=condition=ready node --all --timeout=180s
      changed_when: false

    - name: Show final node and Calico status
      ansible.builtin.shell: |
        kubectl get nodes -o wide
        echo
        kubectl get tigerastatus
      changed_when: false
      register: cluster_status

    - name: Print status
      ansible.builtin.debug:
        var: cluster_status.stdout_lines
