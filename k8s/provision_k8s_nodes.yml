---
- name: Bulk Provision Kubernetes Nodes in VMware Fusion
  hosts: localhost
  gather_facts: false
  connection: local
  become: false
  vars:
    template_path: "/Users/andrew/Virtual Machines.localized/CentOS9aarch64.vmwarevm/CentOS9aarch64.vmx"
    vm_dir: "/Users/andrew/Virtual Machines.localized"
    vdiskmanager: "/Applications/VMware Fusion.app/Contents/Library/vmware-vdiskmanager"

    # Workers carry the platform (Ceph, Prometheus, Harbor...) so they get most of the RAM.
    # root_disk: the template's ~13 GB system disk is enlarged to this (thin provisioned);
    #   workers need room for container images or the kubelet evicts pods (DiskPressure).
    # ceph_disk: true adds a second, empty, thin-provisioned disk used as a Ceph OSD.
    k8s_nodes:
      - { name: "k8s-control-01", cpus: "2", ram: "4096",  root_disk: "20GB" }
      - { name: "k8s-control-02", cpus: "2", ram: "4096",  root_disk: "20GB" }
      - { name: "k8s-control-03", cpus: "2", ram: "4096",  root_disk: "20GB" }
      - { name: "k8s-worker-01",  cpus: "4", ram: "10240", root_disk: "40GB", ceph_disk: true }
      - { name: "k8s-worker-02",  cpus: "4", ram: "10240", root_disk: "40GB", ceph_disk: true }
      - { name: "k8s-worker-03",  cpus: "4", ram: "10240", root_disk: "40GB", ceph_disk: true }

    # Ceph OSD disk: thin provisioned, so it only uses Mac disk space as Ceph fills it.
    # Attached as the second namespace on the template's NVMe controller (nvme0:1),
    # which shows up in the guest as /dev/nvme0n2.
    ceph_disk_size: "100GB"
    ceph_disk_file: "ceph-osd.vmdk"
    ceph_nodes: "{{ k8s_nodes | selectattr('ceph_disk', 'defined') | list }}"
    ceph_vmx_settings:
      - { key: "nvme0:1.present",  value: "TRUE" }
      - { key: "nvme0:1.fileName", value: "{{ ceph_disk_file }}" }

  tasks:
    - name: Power off the existing VMs if running (so the delete below really removes them)
      ansible.builtin.command: >
        "/Applications/VMware Fusion.app/Contents/Public/vmrun" stop
        "/Users/andrew/Virtual Machines.localized/{{ item.name }}.vmwarevm/{{ item.name }}.vmx" hard
      register: vm_stop
      failed_when: false            # not running / doesn't exist yet is fine
      changed_when: vm_stop.rc == 0
      loop: "{{ k8s_nodes }}"

    - name: Ensure clean destination directories exist
      ansible.builtin.file:
        path: "/Users/andrew/Virtual Machines.localized/{{ item.name }}.vmwarevm"
        state: absent
      loop: "{{ k8s_nodes }}"

    - name: Clone the VMware template natively using vmrun
      ansible.builtin.command: '"/Applications/VMware Fusion.app/Contents/Public/vmrun" clone "{{ template_path }}" "/Users/andrew/Virtual Machines.localized/{{ item.name }}.vmwarevm/{{ item.name }}.vmx" full'
      loop: "{{ k8s_nodes }}"

    - name: Rewrite VMware GUI display name string inside vmx file
      ansible.builtin.command: "sed -i '' 's/^displayName =.*/displayName = \"{{ item.name }}\"/g' \"/Users/andrew/Virtual Machines.localized/{{ item.name }}.vmwarevm/{{ item.name }}.vmx\""
      loop: "{{ k8s_nodes }}"

    - name: Inject custom vCPU allocations into vmx file
      ansible.builtin.command: "sed -i '' 's/^numvcpus =.*/numvcpus = \"{{ item.cpus }}\"/g' \"/Users/andrew/Virtual Machines.localized/{{ item.name }}.vmwarevm/{{ item.name }}.vmx\""
      loop: "{{ k8s_nodes }}"

    - name: Inject custom Memory allocations into vmx file
      ansible.builtin.command: "sed -i '' 's/^memsize =.*/memsize = \"{{ item.ram }}\"/g' \"/Users/andrew/Virtual Machines.localized/{{ item.name }}.vmwarevm/{{ item.name }}.vmx\""
      loop: "{{ k8s_nodes }}"

    # The system disk is nvme0:0; read its file name from the .vmx (clones may rename it).
    # The guest's partition/LVM/filesystem is grown to match in 01_configure_k8s_cluster.yml.
    - name: Find each VM's system disk file
      ansible.builtin.shell: >
        awk -F'"' '/^nvme0:0\.fileName/ {print $2}'
        "{{ vm_dir }}/{{ item.name }}.vmwarevm/{{ item.name }}.vmx"
      loop: "{{ k8s_nodes | selectattr('root_disk', 'defined') | list }}"
      register: root_vmdks
      changed_when: false
      failed_when: root_vmdks.stdout == ""   # (inside a loop: this item's result)

    - name: Enlarge the system disk (thin provisioned)
      ansible.builtin.command: >
        "{{ vdiskmanager }}" -x {{ item.item.root_disk }}
        "{{ vm_dir }}/{{ item.item.name }}.vmwarevm/{{ item.stdout }}"
      loop: "{{ root_vmdks.results }}"
      loop_control:
        label: "{{ item.item.name }}: {{ item.stdout }} -> {{ item.item.root_disk }}"
      changed_when: true

    - name: Create the Ceph OSD disk on each worker (thin provisioned)
      ansible.builtin.command: >
        "{{ vdiskmanager }}" -c -s {{ ceph_disk_size }} -a lsilogic -t 0
        "{{ vm_dir }}/{{ item.name }}.vmwarevm/{{ ceph_disk_file }}"
      args:
        creates: "{{ vm_dir }}/{{ item.name }}.vmwarevm/{{ ceph_disk_file }}"
      loop: "{{ ceph_nodes }}"

    - name: Attach the Ceph OSD disk to each worker's NVMe controller
      ansible.builtin.lineinfile:
        path: "{{ vm_dir }}/{{ item.0.name }}.vmwarevm/{{ item.0.name }}.vmx"
        regexp: '^{{ item.1.key | regex_escape }}\s*='
        line: '{{ item.1.key }} = "{{ item.1.value }}"'
      loop: "{{ ceph_nodes | product(ceph_vmx_settings) | list }}"
      loop_control:
        label: "{{ item.0.name }}: {{ item.1.key }}"

    - name: Power on all Kubernetes nodes inside VMware Fusion
      ansible.builtin.command: '"/Applications/VMware Fusion.app/Contents/Public/vmrun" start "/Users/andrew/Virtual Machines.localized/{{ item.name }}.vmwarevm/{{ item.name }}.vmx" gui'
      loop: "{{ k8s_nodes }}"

    - name: Notify next orchestration sequence
      ansible.builtin.debug:
        msg: "All 6 Kubernetes nodes are booting (workers with a {{ ceph_disk_size }} Ceph disk). Proceeding to network loops."
