---
# Install and configure Jenkins on the VM built by 01_provision_jenkins.yml.
# Safe to re-run at any time (e.g. after editing group_vars/all.yml): it never
# deletes or re-clones the VM, so build history is kept.
#
#   ansible-playbook -i jenkins_inventory.ini 02_configure_jenkins.yml -k -K

- name: Install and Configure Jenkins
  hosts: jenkins
  become: true

  tasks:

    # --- Baseline packages ---

    - name: Install baseline packages
      ansible.builtin.dnf:
        name:
          - git
          - java-21-openjdk
          - python3-pip
          - fontconfig      # Jenkins UI dependency
        state: present
        update_cache: true

    # --- Ansible + ansible-lint (so Jenkins can run pipelines) ---

    - name: Install ansible-core
      ansible.builtin.dnf:
        name: ansible-core
        state: present

    - name: Install ansible-lint via pip
      ansible.builtin.pip:
        name: ansible-lint
        executable: pip3

    # --- Jenkins repository and package ---

    - name: Download Jenkins LTS repo file
      ansible.builtin.get_url:
        url: https://pkg.jenkins.io/redhat-stable/jenkins.repo
        dest: /etc/yum.repos.d/jenkins.repo
        mode: '0644'

    - name: Import Jenkins GPG key
      ansible.builtin.rpm_key:
        key: https://pkg.jenkins.io/redhat-stable/jenkins.io-2023.key
        state: present

    - name: Install Jenkins LTS
      ansible.builtin.dnf:
        name: jenkins
        state: present
        update_cache: true

    # --- Firewall ---

    - name: Open port 8080 for Jenkins UI
      ansible.posix.firewalld:
        port: 8080/tcp
        permanent: true
        state: enabled
        immediate: true

    # --- Unattended setup: no wizard, plugins, Configuration as Code ---

    # Jinja tests run on the controller (the Mac), so no delegation/SSH needed
    - name: Stop early if the GitHub SSH key is missing on the Mac
      ansible.builtin.fail:
        msg: "GitHub SSH key not found at {{ github_ssh_key }} - set github_ssh_key in group_vars/all.yml"
      when: github_ssh_key is not file

    - name: Create Jenkins directories
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: directory
        owner: jenkins
        group: jenkins
        mode: "{{ item.mode }}"
      loop:
        - { path: /var/lib/jenkins/.ssh,         mode: '0700' }
        - { path: /var/lib/jenkins/casc_configs, mode: '0700' }
        - { path: /var/lib/jenkins/plugins,      mode: '0755' }

    - name: Install the GitHub SSH key for Jenkins
      ansible.builtin.copy:
        src: "{{ github_ssh_key }}"
        dest: /var/lib/jenkins/.ssh/id_github
        owner: jenkins
        group: jenkins
        mode: '0600'
      no_log: true
      notify: Restart Jenkins

    - name: Scan GitHub SSH host keys
      ansible.builtin.command: ssh-keyscan -t ed25519,ecdsa,rsa github.com
      register: github_host_keys
      changed_when: false

    - name: Trust GitHub host keys for the jenkins user
      ansible.builtin.known_hosts:
        path: /var/lib/jenkins/.ssh/known_hosts
        name: github.com
        key: "{{ item }}"
      loop: "{{ github_host_keys.stdout_lines | select('match', '^github\\.com ') | list }}"

    - name: Make known_hosts owned by jenkins
      ansible.builtin.file:
        path: /var/lib/jenkins/.ssh/known_hosts
        owner: jenkins
        group: jenkins
        mode: '0644'

    - name: Download the Jenkins plugin installation manager
      ansible.builtin.get_url:
        url: "{{ plugin_manager_url }}"
        dest: /opt/jenkins-plugin-manager.jar
        mode: '0644'

    - name: Copy the plugin list
      ansible.builtin.copy:
        src: files/plugins.txt
        dest: /var/lib/jenkins/plugins.txt
        owner: jenkins
        group: jenkins
        mode: '0644'
      register: plugin_list

    - name: Install Jenkins plugins and their dependencies
      ansible.builtin.command: >
        java -jar /opt/jenkins-plugin-manager.jar
        --war /usr/share/java/jenkins.war
        --plugin-download-directory /var/lib/jenkins/plugins
        --plugin-file /var/lib/jenkins/plugins.txt
      when: plugin_list.changed
      notify: Restart Jenkins

    - name: Give the jenkins user ownership of the plugins
      ansible.builtin.file:
        path: /var/lib/jenkins/plugins
        owner: jenkins
        group: jenkins
        recurse: true

    - name: Write the Configuration as Code file (admin user, credential, jobs)
      ansible.builtin.template:
        src: templates/jenkins.yaml.j2
        dest: /var/lib/jenkins/casc_configs/jenkins.yaml
        owner: jenkins
        group: jenkins
        mode: '0600'
      notify: Restart Jenkins

    - name: Create the systemd override directory
      ansible.builtin.file:
        path: /etc/systemd/system/jenkins.service.d
        state: directory
        mode: '0755'

    - name: Skip the setup wizard and load Configuration as Code at startup
      ansible.builtin.copy:
        dest: /etc/systemd/system/jenkins.service.d/override.conf
        mode: '0644'
        content: |
          [Service]
          Environment="JAVA_OPTS=-Djava.awt.headless=true -Djenkins.install.runSetupWizard=false"
          Environment="CASC_JENKINS_CONFIG=/var/lib/jenkins/casc_configs"
      notify: Restart Jenkins

    # --- Service ---

    - name: Apply pending Jenkins restarts
      ansible.builtin.meta: flush_handlers

    - name: Enable and start Jenkins service
      ansible.builtin.systemd_service:
        name: jenkins
        state: started
        enabled: true

    # Don't compare json.name to the user: when user == password (admin/admin)
    # Ansible masks the password value in the response, hiding the name.
    - name: Wait for Jenkins to come up and accept the admin login
      ansible.builtin.uri:
        url: http://localhost:8080/whoAmI/api/json
        url_username: "{{ jenkins_admin_user }}"
        url_password: "{{ jenkins_admin_password }}"
        force_basic_auth: true
        return_content: true
      register: jenkins_whoami
      until: >-
        jenkins_whoami.status == 200
        and jenkins_whoami.json.authenticated | default(false)
        and not jenkins_whoami.json.anonymous | default(true)
      retries: 40
      delay: 6

    - name: List the jobs Configuration as Code created
      ansible.builtin.uri:
        url: "http://localhost:8080/api/json?tree=jobs[name]"
        url_username: "{{ jenkins_admin_user }}"
        url_password: "{{ jenkins_admin_password }}"
        force_basic_auth: true
        return_content: true
      register: jenkins_job_list

    - name: Print Jenkins login details
      ansible.builtin.debug:
        msg:
          - "Jenkins is ready at {{ jenkins_url }} (no setup wizard)"
          - "Log in as {{ jenkins_admin_user }} / {{ jenkins_admin_password }}"
          - "Jobs: {{ jenkins_job_list.json.jobs | map(attribute='name') | join(', ') }}"

  handlers:
    - name: Restart Jenkins
      ansible.builtin.systemd_service:
        name: jenkins
        state: restarted
        daemon_reload: true
