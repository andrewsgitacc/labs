# Admin tools host. In this lab the DNS server doubles as the utility server
# (see admin/README.md). To move the tools to a dedicated VM later, point
# this entry at that VM and re-run install_admin_tools.yml.
[admin_hosts]
dns.lab.local ansible_host=172.16.79.10

[all:vars]
ansible_user=admin
ansible_ssh_common_args="-o UserKnownHostsFile=/dev/null -o StrictHostKeyChecking=no -o PubkeyAuthentication=no -o PreferredAuthentications=password"
