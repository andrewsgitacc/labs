---
# Pinned versions of the admin CLI tools (linux arm64).
# Bump them here and re-run install_admin_tools.yml. (Renovate can open PRs
# for these once it's set up in Phase 9.)

# kubectl comes from the same pkgs.k8s.io repo as the cluster, so it always
# matches the cluster's minor version.
k8s_minor_version: "v1.36"

helm_version: "v4.2.4"   # https://github.com/helm/helm/releases
k9s_version: "v0.51.0"   # https://github.com/derailed/k9s/releases
stern_version: "1.34.0"  # https://github.com/stern/stern/releases (no "v" in file names)
yq_version: "v4.54.1"    # https://github.com/mikefarah/yq/releases
